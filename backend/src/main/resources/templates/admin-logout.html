<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Déconnexion – Gestion Charité</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: 'DM Sans', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0c7a8a 0%, #0a5f72 50%, #07485a 100%);
            color: #fff;
        }
        .card {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 18px;
            padding: 32px 28px;
            text-align: center;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.22);
            backdrop-filter: blur(10px);
            max-width: 420px;
            width: calc(100% - 32px);
        }
        .title {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 10px;
        }
        .text {
            margin: 0;
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.6;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="title">Déconnexion en cours</div>
    <p class="text">Merci de patienter, nous fermons votre session et nettoyons les données locales.</p>
</div>

<script>
    try {
        localStorage.removeItem('user');
        localStorage.removeItem('pendingDonationPayment');
    } catch (e) {
        // ignore storage failures
    }
    window.location.replace('http://localhost:5173');
</script>
</body>
</html>
