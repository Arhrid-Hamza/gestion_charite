<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Admin – Gestion Charité</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'DM Sans', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0c7a8a 0%, #0a5f72 50%, #07485a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 420px;
            overflow: hidden;
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-header-custom {
            background: #2c3e50;
            color: white;
            text-align: center;
            padding: 30px 20px;
            font-weight: 700;
            font-size: 1.4rem;
        }

        .card-body-custom {
            padding: 40px 30px;
        }

        .form-control {
            border-radius: 8px;
            padding: 12px 16px;
            border: 1px solid #ced4da;
            transition: all 0.3s;
        }

        .form-control:focus {
            border-color: #3498db;
            box-shadow: 0 0 0 0.25rem rgba(52, 152, 219, 0.25);
        }

        .btn-login {
            background: linear-gradient(90deg, #2c3e50 0%, #3498db 100%);
            border: none;
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s;
            width: 100%;
            margin-top: 10px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
            color: white;
        }

        .brand-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #7f8c8d;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #2c3e50;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="card-header-custom">
        <div class="brand-icon">🛡️</div>
        <div>Admin Panel</div>
    </div>
    <div class="card-body-custom">
        <!-- Error Alert -->
        <div th:if="${loginError}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${loginError}">Erreur de connexion</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <form method="post" th:action="@{/admin/login}">
            <div class="mb-3">
                <label for="email" class="form-label text-secondary fw-semibold">Adresse Email</label>
                <input type="email" class="form-control" id="email" name="email" required placeholder="admin@gestion-charite.local">
            </div>
            <div class="mb-4">
                <label for="password" class="form-label text-secondary fw-semibold">Mot de passe</label>
                <input type="password" class="form-control" id="password" name="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-login">Se Connecter</button>
        </form>

        <a href="http://localhost:5173" class="back-link">← Retour au site principal</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
